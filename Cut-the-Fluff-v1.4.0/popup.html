<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cut the Fluff</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <div><h1>Cut the Fluff</h1><p>Say more with less.</p></div>
      </div>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3v-4h.08A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.88L4.2 7.02l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.04V3h4v.08a1.7 1.7 0 0 0 1.04 1.52 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.96 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
      </button>
    </header>

    <section class="scan-card" aria-labelledby="scan-title">
      <div class="scan-copy">
        <div class="scan-title-row"><span class="pulse-dot"></span><strong id="scan-title">Writing-pattern scan</strong></div>
        <p id="scan-description">Highlights common filler patterns on this tab. It does not determine who wrote the text.</p>
      </div>
      <label class="switch" title="Scan this tab">
        <input id="page-scan" type="checkbox">
        <span class="slider"></span>
      </label>
    </section>

    <section class="workspace">
      <div class="field-head">
        <label for="input">Your text</label>
        <span id="char-count">0 / 30,000</span>
      </div>
      <div class="editor-shell">
        <textarea id="input" maxlength="30000" rows="7" spellcheck="true" placeholder="Paste something wordy. Get something clear."></textarea>
        <button id="clear" class="clear-btn hidden" type="button" aria-label="Clear text">×</button>
      </div>
      <div class="editor-tools">
        <button id="use-selection" class="text-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4M5 4v4M19 4h-4M19 4v4M5 20h4M5 20v-4M19 20h-4M19 20v-4"/></svg>
          Use page selection
        </button>
        <label class="tone-wrap" for="tone"><span>Style</span>
          <select id="tone">
            <option value="human" selected>Human</option>
            <option value="professional">Professional</option>
            <option value="shorten">Shorten</option>
          </select>
        </label>
      </div>
      <button id="run" class="primary" type="button">
        <span class="run-label">Cut the fluff</span>
        <span class="shortcut">Enter ↵</span>
      </button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section id="output-wrap" class="result hidden" aria-live="polite">
      <div class="result-head">
        <div><span class="eyebrow">Result</span><strong id="result-meta">Clearer, same meaning</strong></div>
        <span id="savings" class="savings"></span>
      </div>
      <div id="output" class="output" tabindex="0"></div>
      <div class="result-actions">
        <button id="try-again" class="secondary" type="button">Try again</button>
        <button id="copy" class="primary compact" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          <span>Copy result</span>
        </button>
      </div>
    </section>

    <footer>
      <span class="maker-mark">Made by MOB</span>
      <span class="footer-links"><a href="privacy.html" target="_blank">Privacy</a><a href="terms.html" target="_blank">Terms</a><button id="footer-settings" type="button">Settings</button></span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
